<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Navigator</title>
    <link rel="preload" href="./src/styles/fonts.css" as="style" />
    <link rel="preload" href="./src/styles/tailwind-internal.css" as="style" />
    <link rel="stylesheet" href="./src/styles/fonts.css" />
    <link rel="stylesheet" href="./src/styles/tailwind-internal.css" />
    <style>
      .hv-modal-panel {
        max-height: calc(100vh - 2rem);
      }

      @media (min-width: 640px) {
        .hv-modal-panel {
          max-height: calc(100vh - 4rem);
        }
      }

      .hv-button-draft {
        background-color: #f59e0b;
        border: 1px solid #d97706;
        color: #ffffff;
      }

      .hv-button-draft:hover {
        background-color: #d97706;
      }

      .hv-button-draft:focus-visible {
        outline: 2px solid #f59e0b;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body class="bg-gray-100">
    <div id="root">
      <div class="min-h-screen flex items-center justify-center bg-gray-100">
        <div class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm hv-surface">
          <div class="flex items-center gap-3 text-sm text-gray-600">
            <span class="loading-spinner" aria-hidden="true"></span>
            <span>Chargement de l&apos;accueil...</span>
          </div>
          <p class="mt-2 text-xs text-gray-400">Pr&eacute;paration de votre espace.</p>
        </div>
      </div>
    </div>

    <script src="./src/vendor/react.production.min.js"></script>
    <script src="./src/vendor/react-dom.production.min.js"></script>
    <script src="./src/module-loader.js"></script>
    <script>
      (async function bootstrapApplication() {
        const renderBootstrapError = (error) => {
          const root = document.getElementById('root');
          if (!root) {
            return;
          }

          root.innerHTML = `
            <div class="min-h-screen flex items-center justify-center bg-gray-100 p-6">
              <div class="max-w-lg rounded-2xl border border-red-200 bg-white p-6 shadow-sm hv-surface">
                <h1 class="text-lg font-semibold text-red-700">Impossible d'afficher l'application</h1>
                <p class="mt-3 text-sm text-gray-700">
                  Le chargement automatique de la page d'accueil a échoué. Rechargez la page, puis vérifiez que tous les fichiers du projet sont bien accessibles.
                </p>
                <p class="mt-2 text-xs text-gray-500">Détail technique : ${String(error && error.message ? error.message : error)}</p>
              </div>
            </div>
          `;
        };


        const loadScript = (src) => new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = src;
          script.async = true;
          script.onload = () => resolve();
          script.onerror = () => reject(new Error(`Impossible de charger ${src}.`));
          document.head.appendChild(script);
        });

        const ensureManifestForFileProtocol = async () => {
          if (window.location.protocol !== 'file:' || window.__COMPLIANCE_NAVIGATOR_MANIFEST__) {
            return;
          }

          await loadScript('./src/module-manifest.js');
        };

        const ensureBabelRuntime = async () => {
          if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
            return;
          }

          await loadScript('./src/vendor/babel.min.js');
        };

        const waitForAppMount = (timeoutMs = 1800) => new Promise((resolve) => {
          const root = document.getElementById('root');
          const start = Date.now();

          const checkMounted = () => {
            if (root && root.dataset && root.dataset.appMounted === 'true') {
              resolve(true);
              return;
            }

            if (Date.now() - start >= timeoutMs) {
              resolve(false);
              return;
            }

            window.requestAnimationFrame(checkMounted);
          };

          checkMounted();
        });

        const fallbackToBabelScript = () => {
          if (!window.Babel || typeof window.Babel.transformScriptTags !== 'function') {
            return false;
          }

          const script = document.createElement('script');
          script.type = 'text/babel';
          script.setAttribute('data-type', 'module');
          script.src = './src/main.jsx';
          document.body.appendChild(script);
          window.Babel.transformScriptTags([script]);
          return true;
        };

        try {
          if (window.ModuleLoader && typeof window.ModuleLoader.import === 'function') {
            try {
              window.ModuleLoader.import('./src/main.jsx');
              const isMountedWithModuleLoader = await waitForAppMount();
              if (isMountedWithModuleLoader) {
                return;
              }

              throw new Error('Le rendu initial n’a pas confirmé le montage de l’application.');
            } catch (initialError) {
              if (window.location.protocol === 'file:') {
                await ensureManifestForFileProtocol();
                window.ModuleLoader.import('./src/main.jsx');
                const isMountedWithManifest = await waitForAppMount();
                if (isMountedWithManifest) {
                  return;
                }

                throw new Error('Le rendu initial n’a pas confirmé le montage de l’application.');
              }

              throw initialError;
            }
          }

          await ensureBabelRuntime();
          if (!fallbackToBabelScript()) {
            throw new Error('ModuleLoader indisponible et fallback Babel non disponible.');
          }

          const isMountedWithBabelFallback = await waitForAppMount();
          if (!isMountedWithBabelFallback) {
            throw new Error('Le fallback Babel a été chargé mais l’application ne s’est pas affichée.');
          }
        } catch (error) {
          console.error('Erreur lors du chargement de l\'application :', error);

          try {
            await ensureBabelRuntime();
            if (!fallbackToBabelScript()) {
              throw error;
            }

            const isMountedAfterRecovery = await waitForAppMount(2200);
            if (!isMountedAfterRecovery) {
              throw new Error('Le fallback de récupération n’a pas permis d’afficher l’application.');
            }
              return;
          } catch (fallbackError) {
            renderBootstrapError(fallbackError);
          }
        }
      })();
    </script>
  </body>
</html>
